{% extends "base.html" %}
{% block content %}
<div class="login-box">
  <h1>Admin login</h1>
  <p class="hint">Sign in to manage your website.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>Password<input type="password" name="password" required autofocus autocomplete="current-password"></label>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p class="hint"><a href="{{ url_for('home') }}">Back to website</a></p>
</div>
{% endblock %}
